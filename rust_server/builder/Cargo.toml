[package]
name = "builder"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kd_tree = { path = "../kd_tree" }
kdam = "0.6"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
glob = "0.3"
clap = { version = "4.3.0", features = ["derive"] }
parquet = { version = "60.1.0", default-features = false, features = [
    "arrow", "snap", "zstd", "lz4",
] }
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
